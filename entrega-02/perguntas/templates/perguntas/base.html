{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#015B80">

    <title>{% block title %}Operos | IoT{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/estilo.css' %}?v=7">

    <link rel="icon" type="image/png" href="{% static 'imagens_gerais/favicon.png' %}">

</head>

<body class="{% block body_class %}site-page{% endblock %}">

    <header class="site-header">

        
        <div class="header-inner">

            <a class="brand" href="{% url 'perguntas:index' %}">

                <img
                    src="{% static 'imagens_gerais/logo_operos_branco.png' %}"
                    alt="Operos"
                >

            </a>


            <button
                class="menu-toggle"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false"
                data-menu-toggle
            >
                <span></span>
                <span></span>
                <span></span>
            </button>


            <nav class="main-nav" data-menu>

                <div class="nav-links">

                    <a href="{% url 'perguntas:index' %}#conhecendo-iot">
                        Conhecendo IoT
                    </a>

                    <a href="{% url 'perguntas:index' %}#segmentos">
                        Segmentos
                    </a>

                    <a href="{% url 'perguntas:index' %}#inovacoes">
                        Inovações
                    </a>

                    <a href="{% url 'perguntas:index' %}#sobre-nos">
                        Sobre nós
                    </a>

                </div>


                <div class="nav-actions">

                    {% if user.is_authenticated %}

                        <div class="nav-user">

                            <span class="nav-user-name">
                                Olá, {{ user.nome_exibicao|default:user.username }}
                            </span>

                            <form action="{% url 'perguntas:logout' %}" method="post">

                                {% csrf_token %}

                                <button class="nav-login" type="submit">
                                    Sair
                                </button>

                            </form>

                        </div>

                    {% else %}

                        <a class="nav-login" href="{% url 'perguntas:login' %}" data-page-transition>
                            Login
                        </a>

                        <a class="nav-signup" href="{% url 'perguntas:cadastro' %}" data-page-transition>
                            Cadastre-se
                        </a>

                    {% endif %}

                </div>

            </nav>

        </div>


    </header>

    <main class="site-main {% block main_class %}{% endblock %}">

        {% block content %}
        {% endblock %}

    </main>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>

    <script src="{% static 'js/operos.js' %}?v=9" defer></script>

</body>
</html>
