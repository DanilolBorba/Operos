{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#015B80">

    <title>{% block title %}Operos | IoT{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/estilo.css' %}?v=2">

</head>

<body class="{% block body_class %}site-page{% endblock %}">

    <header class="site-header">

        <div class="header-inner">

            <a class="brand" href="{% url 'perguntas:index' %}">
                <img src="{% static 'imagens_gerais/logo_operos_branco.png' %}" alt="Operos">
            </a>

            <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" data-menu-toggle>
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="main-nav" data-menu>

                <a href="{% url 'perguntas:index' %}#conhecendo-iot">
                    Conhecendo IoT
                </a>

                <a href="{% url 'perguntas:index' %}#segmentos">
                    Segmentos
                </a>

                <a href="{% url 'perguntas:index' %}#inovacoes">
                    Inovações
                </a>

                <a href="{% url 'perguntas:index' %}#sobre-nos">
                    Sobre nós
                </a>

                {% if user.is_authenticated %}

                    <div class="nav-user">

                        <span class="nav-user-name">
                            Olá, {{ user.nome_exibicao|default:user.username }}
                        </span>

                        <form action="{% url 'perguntas:logout' %}" method="post">

                            {% csrf_token %}

                            <button class="nav-login" type="submit">
                                Sair
                            </button>

                        </form>

                    </div>

                {% else %}

                    <a class="nav-login" href="{% url 'perguntas:login' %}">
                        Login
                    </a>

                    <a class="nav-signup" href="{% url 'perguntas:cadastro' %}">
                        Cadastre-se
                    </a>

                {% endif %}

            </nav>

        </div>

    </header>

    <main class="site-main {% block main_class %}{% endblock %}">

        {% block content %}
        {% endblock %}

    </main>

    <script src="{% static 'js/operos.js' %}?v=2" defer></script>

</body>
</html>
