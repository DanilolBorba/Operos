{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Operos</title>
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>
    <header class="header-principal">
        <img src="{% static 'imagens_gerais/logo_operos.png' %}" alt="Operos" height="100">
        <nav>
            <a href="{% url 'perguntas:index' %}">Home</a> |
            <a href="{% url 'perguntas:quem_somos' %}">Quem Somos</a> |
            <a href="{% url 'perguntas:inserir_pergunta' %}" class="btn-fale-conosco">Fale Conosco</a>

            {% if user.is_authenticated %}
                <!-- mostra icon padrão e o primeiro nome do nome de exibição -->
                <div class="usuario-logado-info" style="display: inline-flex; align-items: center; gap: 8px; margin-left: 15px;">
                    <span class="avatar-default" style="width: 32px; height: 32px; background-color: #ccc; border-radius: 50%; display: inline-block;"></span>
                    <span class="saudacao-usuario">
                        Olá, {{ user.nome_exibicao|default:user.username|slugify|title|cut:"-"|truncatewords:1 }}!
                    </span>
                    <form action="{% url 'perguntas:logout' %}" method="post" style="display: inline; margin: 0;">
                        {% csrf_token %}
                        <button type="submit" class="btn-logout" style="background: none; border: none; cursor: pointer; color: inherit;">Sair</button>
                    </form>
                </div>
            {% else %}
                <!-- botao p criar conta ou logar para vistitantes -->
                <a href="{% url 'perguntas:cadastro' %}" class="btn-criar-conta" style="margin-left: 10px;">Criar conta</a>
                <a href="{% url 'perguntas:login' %}" class="btn-login" style="margin-left: 10px;">Entrar</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
