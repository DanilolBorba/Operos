{% extends "perguntas/base.html" %}

{% block content %}
<form name = "form" method="post">
    {% csrf_token %}
    <p><label for="titulo">O que você quer nos falar?</label><br>
        <input type="text" name="titulo" id="titulo" size="50" maxlength="200">
    </p>
    <p><label for="detalhe">Detalhe sua situação:<br />
            <textarea rows="6" cols="50" id="detalhe" name="detalhe"></textarea>
    </p>

    <input type="submit" name="botao_inserir_pergunta" value="Salvar" />

</form>

{% if perguntas %}
    <h2>Últimas perguntas</h2>
    <ul>
    {% for pergunta in perguntas %}
        <li>
            <a href="{% url 'perguntas:detalhe' pergunta.id %}">
                {{ pergunta.titulo }}
            </a>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>Nenhuma pergunta disponível.</p>
{% endif %}
{% endblock %}
